name: Import original Edison exports

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Download original source exports and verify hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sources
          curl -fL --retry 2 -o sources/subject_list_platne.pdf 'https://drive.usercontent.google.com/download?id=1m4SiXFHLoeC9SEckvEox-ncegA69W-SR&export=download&confirm=t'
          curl -fL --retry 2 -o sources/subject_list_vsechny.pdf 'https://drive.usercontent.google.com/download?id=1u7lNHUZ0eHqEOiGbftalypy672KdmvXX&export=download&confirm=t'
          curl -fL --retry 2 -o sources/subject_list_platne.xls 'https://drive.usercontent.google.com/download?id=1bw6GkjB5NZrHioasKfmKBdS6LxyVAgpv&export=download&confirm=t'
          curl -fL --retry 2 -o sources/subject_list_vsechny.xls 'https://drive.usercontent.google.com/download?id=1LCqajIWDDF1h76kP9Np5h3-CHKyVCamD&export=download&confirm=t'
          cd sources
          echo 'c039116a78a8fcd888f9c39f154bc2b2d4b485a3cd23cf1aabef48606719efea  subject_list_platne.pdf' | sha256sum -c -
          echo '7dc3d38037927e3ebcbc563100ed4c75211f249fed40d7a56a898f51a3e5c4b1  subject_list_vsechny.pdf' | sha256sum -c -
          echo 'd00496f926f53ca6d826d3cc2969b93222b2236ba4a82841c532ace51d45f13f  subject_list_platne.xls' | sha256sum -c -
          echo '7b4c0cbcbc915232c353223ee3ddc1a24ffe1620c747958b65a107e8481b8558  subject_list_vsechny.xls' | sha256sum -c -
      - name: Commit verified source exports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/subject_list_platne.pdf sources/subject_list_vsechny.pdf sources/subject_list_platne.xls sources/subject_list_vsechny.xls
          git rm .github/workflows/import-source-exports.yml
          git commit -m 'Archive original Edison PDF/XLS exports'
          git push origin HEAD:${{ github.head_ref }}
