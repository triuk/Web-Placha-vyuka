name: Fill CSV roles once

on:
  push:
    branches:
      - consistency-audit

permissions:
  contents: write

jobs:
  fill:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v6
        with:
          ref: consistency-audit
      - name: Populate role_PLA88 from raw HTML
        run: python3 scripts/fill_roles.py
      - name: Commit generated CSV
        run: |
          if git diff --quiet -- Placha_versions_verified.csv; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Placha_versions_verified.csv
          git commit -m 'Populate PLA88 roles in verified CSV'
          git push origin HEAD:consistency-audit
