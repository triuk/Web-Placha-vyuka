name: Build final report data

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Build data.js and CSV from raw archive
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, html, json, re
          from pathlib import Path

          VALID=set('542-0520 9350-3021 9360-0106 9360-0120 9360-0125 9360-0182 9360-0191 9360-0205 9360-0207 9360-0233 9360-0234 9360-0235 9360-0236 9360-0903'.split())
          oldtxt=Path('data.js').read_text(encoding='utf-8')
          old=json.loads(oldtxt.split('=',1)[1].rstrip(' ;\n'))
          names={r[0].split('/')[0]:r[1] for r in old}
          manifest=list(csv.DictReader(open('archive/manifest.csv',encoding='utf-8')))
          mm={r['version']:r for r in manifest if r['kind']=='version'}
          rows=[]; csvrows=[]
          for ver,m in sorted(mm.items()):
              p=Path(m['file'])
              b=p.read_bytes()
              if b'PLA88' not in b: continue
              text=b.decode('utf-8','ignore')
              code=ver.split('/')[0]
              name=names.get(code, code)
              def field(label):
                  pat=rf'<span class="outputText">{re.escape(label)}</span></td><td class="value"><span class="outputText">(.*?)</span>'
                  x=re.search(pat,text,re.S)
                  return html.unescape(re.sub('<.*?>','',x.group(1))).strip() if x else ''
              start=field('Rok zavedení'); end=field('Rok zrušení')
              valid=int(code in VALID)
              focus=int(valid and (end=='2025/2026' or (not end and start and int(start[:4])<=2025)))
              tr=re.search(r'<tr[^>]*>.*?<span class="outputText">PLA88</span>.*?</tr>',text,re.S)
              role=''
              if tr:
                  tds=re.findall(r'<td[^>]*>(.*?)</td>',tr.group(0),re.S)
                  rr=[]
                  if len(tds)>=4:
                      if '<img' in tds[2]: rr.append('cvičící')
                      if '<img' in tds[3]: rr.append('přednášející')
                  role='+'.join(rr)
              sha=m['sha256']
              rows.append([ver,name,start,end,valid,focus,sha])
              csvrows.append({'version':ver,'code':code,'name':name,'introduced':start,'cancelled':end,'valid_or_future_export':valid,'focus_2025_2026':focus,'role_PLA88':role,'offline_file':m['file'],'edison_url':m['url'],'sha256':sha})
          assert len(rows)==106, len(rows)
          assert len({r[0].split('/')[0] for r in rows})==54
          assert sum(r[5] for r in rows)==28, sum(r[5] for r in rows)
          Path('data.js').write_text('window.PLACHA_DATA='+json.dumps(rows,ensure_ascii=False,separators=(',',':'))+';\n',encoding='utf-8')
          with open('Placha_versions_verified.csv','w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=list(csvrows[0])); w.writeheader(); w.writerows(csvrows)
          Path('archive/report-build.txt').write_text('versions_with_PLA88=106\nsubjects_with_PLA88=54\nfocus_2025_2026_versions=28\nfocus_2025_2026_subjects=14\nnew_vs_original=9360-0125/02\n',encoding='utf-8')
          print('Built 106 PLA88 versions; 28 focus versions; 54 subjects.')
          PY
      - name: Commit generated report data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js Placha_versions_verified.csv archive/report-build.txt
          git commit -m "Regenerate report data from GitHub raw archive"
          git push origin HEAD:${{ github.head_ref }}
