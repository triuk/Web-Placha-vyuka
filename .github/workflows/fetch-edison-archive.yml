name: Fetch Edison archive into PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fetch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Download and verify Edison pages
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, hashlib, html, json, os, re, time
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import parse_qs, quote, unquote, urljoin, urlparse
          from urllib.request import build_opener, HTTPCookieProcessor, Request
          import http.cookiejar

          CODES = '''542-0520 546-0320 546-0371 546-0456 546-0462 615-0401 615-0807 615-0810 615-0815 617-1401 617-1807 617-1810 617-1815 730-0004 730-0005 730-0014 730-0015 730-0102 730-0106 730-0120 730-0121 730-0125 730-0135 730-0136 730-0146 730-0153 730-0154 9350-3021 9360-0002 9360-0003 9360-0004 9360-0005 9360-0014 9360-0015 9360-0106 9360-0120 9360-0125 9360-0131 9360-0132 9360-0135 9360-0136 9360-0146 9360-0153 9360-0154 9360-0182 9360-0191 9360-0205 9360-0207 9360-0227 9360-0233 9360-0234 9360-0235 9360-0236 9360-0903'''.split()
          assert len(CODES) == 54 and len(set(CODES)) == 54
          BASE='https://edison.sso.vsb.cz/cz.vsb.edison.edu.study.prepare.web/'
          cj=http.cookiejar.CookieJar(); opener=build_opener(HTTPCookieProcessor(cj))
          headers={'User-Agent':'Mozilla/5.0 (compatible; Web-Placha-vyuka archival evidence/1.0)'}
          def get(url):
              last=None
              for attempt in range(4):
                  try:
                      with opener.open(Request(url, headers=headers), timeout=45) as r:
                          data=r.read()
                      if len(data) < 1000: raise RuntimeError(f'suspiciously short response: {len(data)}')
                      time.sleep(.12)
                      return data
                  except Exception as e:
                      last=e; time.sleep(1+attempt)
              raise RuntimeError(f'GET failed {url}: {last}')
          class Links(HTMLParser):
              def __init__(self): super().__init__(); self.hrefs=[]
              def handle_starttag(self, tag, attrs):
                  if tag.lower()=='a':
                      for k,v in attrs:
                          if k.lower()=='href' and v: self.hrefs.append(v)
          root=Path('archive'); sdir=root/'subjects'; vdir=root/'versions'
          sdir.mkdir(parents=True, exist_ok=True); vdir.mkdir(parents=True, exist_ok=True)
          manifest=[]; versions={}
          for code in CODES:
              url=BASE+'Subject.faces?subject='+quote(code)+'&locale=cs'
              data=get(url); fn=f'subject_{code}.html'; (sdir/fn).write_bytes(data)
              manifest.append({'kind':'subject','code':code,'version':'','url':url,'file':f'archive/subjects/{fn}','size':len(data),'sha256':hashlib.sha256(data).hexdigest(),'pla88':'PLA88' in data.decode('utf-8','ignore')})
              p=Links(); p.feed(data.decode('utf-8','ignore'))
              found=set()
              for href in p.hrefs:
                  href=html.unescape(href)
                  if 'SubjectVersion.faces' not in href: continue
                  full=urljoin(BASE, href); q=parse_qs(urlparse(full).query)
                  for val in q.get('version',[]):
                      ver=unquote(val)
                      if ver.startswith(code+'/'): found.add(ver)
              if not found: raise RuntimeError(f'No version links found for {code}')
              versions[code]=sorted(found)
          all_versions=sorted({v for vs in versions.values() for v in vs})
          print('Discovered versions:', len(all_versions))
          if len(all_versions) != 122:
              raise RuntimeError(f'Expected 122 version links, got {len(all_versions)}')
          pla_count=0
          for ver in all_versions:
              url=BASE+'SubjectVersion.faces?version='+quote(ver, safe='')+'&locale=cs'
              data=get(url); safe=ver.replace('/','_'); fn=f'version_{safe}.html'; (vdir/fn).write_bytes(data)
              has=b'PLA88' in data
              pla_count += int(has)
              manifest.append({'kind':'version','code':ver.split('/')[0],'version':ver,'url':url,'file':f'archive/versions/{fn}','size':len(data),'sha256':hashlib.sha256(data).hexdigest(),'pla88':has})
          print('PLA88 version pages:', pla_count)
          if pla_count != 105:
              raise RuntimeError(f'Expected 105 version pages containing PLA88, got {pla_count}')
          (root/'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          with (root/'manifest.csv').open('w', newline='', encoding='utf-8') as f:
              w=csv.DictWriter(f, fieldnames=list(manifest[0])); w.writeheader(); w.writerows(manifest)
          rows=[]
          for m in manifest:
              if m['kind']=='subject':
                  label=m['code']; live=m['url']; off=m['file']
              else:
                  label=m['version']; live=m['url']; off=m['file']
              rows.append(f'<tr><td><code>{label}</code></td><td><a href="../{off}">offline HTML</a></td><td><a href="{live}">Edison online</a></td><td><code>{m["sha256"]}</code></td></tr>')
          page='''<!doctype html><html lang="cs"><meta charset="utf-8"><title>Archiv Edison</title><style>body{font-family:system-ui;max-width:1400px;margin:auto;padding:2rem}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:.4rem;text-align:left}code{font-size:.82em}</style><h1>Offline archiv Edison</h1><p>54 hlavních stránek + 122 konkrétních verzí. Staženo automaticky GitHub Actions 21. 8. 2026.</p><table><thead><tr><th>Položka</th><th>Offline</th><th>Online</th><th>SHA-256</th></tr></thead><tbody>'''+''.join(rows)+'''</tbody></table></html>'''
          (root/'index.html').write_text(page, encoding='utf-8')
          (root/'.complete').write_text(f'subjects=54\nversions=122\npla88_versions=105\n', encoding='utf-8')
          PY
      - name: Commit archive to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- archive
          git commit -m "Archive 54 Edison subjects and 122 versions"
          git push origin HEAD:${{ github.head_ref }}
